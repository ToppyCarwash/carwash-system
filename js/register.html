<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>สมัครสมาชิก — Carwash</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="center-screen">
    <div class="card animate-pop">
      <h1>สมัครสมาชิก</h1>
      <form id="registerForm">
        <label>
          ชื่อ-นามสกุล
          <input type="text" id="fullname" required placeholder="สมชาย ใจดี" />
        </label>
        <label>
          อีเมล
          <input type="email" id="regEmail" required placeholder="you@example.com" />
        </label>
        <label>
          รหัสผ่าน
          <input type="password" id="regPassword" required placeholder="••••••" />
        </label>
        <label>
          บทบาท
          <select id="role">
            <option value="washer">Washer (พนักงานล้าง)</option>
            <option value="admin">Admin</option>
          </select>
        </label>
        <button type="submit" class="btn primary">สมัครสมาชิก</button>
      </form>
      <p class="muted">กลับไปหน้า <a href="index.html">เข้าสู่ระบบ</a></p>
    </div>
  </main>

  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
